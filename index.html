
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá Việt Nam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Hành trình khám phá Việt Nam</h1>
        <p>Những điểm đến tuyệt đẹp và đầy cảm hứng.</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img src="https://images.unsplash.com/photo-1528127269322-539801943592?w=800"
                     alt="Vịnh Hạ Long với những hòn đảo đá vôi giữa biển">
                <figcaption>
                    <h2>Vịnh Hạ Long</h2>
                    <p>Chiêm ngưỡng vẻ đẹp hùng vĩ của biển xanh và những hòn đảo đá vôi.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?w=800"
                     alt="Những ngôi nhà cổ và con phố tại Hội An">
                <figcaption>
                    <h2>Phố cổ Hội An</h2>
                    <p>Khám phá những con phố cổ kính với nét văn hóa truyền thống đặc sắc.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
                     alt="Bãi biển xanh với bờ cát trắng dưới ánh nắng">
                <figcaption>
                    <h2>Bãi biển miền nhiệt đới</h2>
                    <p>Thư giãn bên bờ biển xanh và tận hưởng không khí trong lành.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1528181304800-259b08848526?w=800"
                     alt="Những thửa ruộng bậc thang giữa núi rừng">
                <figcaption>
                    <h2>Ruộng bậc thang</h2>
                    <p>Ngắm nhìn những thửa ruộng uốn lượn giữa núi rừng Tây Bắc.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800"
                     alt="Hồ nước yên bình giữa những ngọn núi xanh">
                <figcaption>
                    <h2>Hồ nước giữa núi rừng</h2>
                    <p>Tìm về sự bình yên giữa thiên nhiên xanh mát và rộng lớn.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800"
                     alt="Thung lũng xanh với những dãy núi trùng điệp">
                <figcaption>
                    <h2>Thung lũng xanh</h2>
                    <p>Khám phá khung cảnh thơ mộng của những thung lũng và dãy núi.</p>
                </figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>© 2026 | Hành trình khám phá Việt Nam</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
